name: ZhaoXi Monorepo CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: zhaoxi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:13.2
      - run: npm run typecheck:all
      - run: npm run build:all
